<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Controle de Tarefas</h1>
        <div class="form">
            <input id="titulo" placeholder="Título" aria-label="Título da tarefa">
            <input id="descricao" placeholder="Descrição" aria-label="Descrição da tarefa">
            <select id="prioridade" aria-label="Prioridade da tarefa">
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
            </select>
            <button type="button" onclick="adicionar()">Adicionar</button>
        </div>
        <p id="mensagem" role="status" aria-live="polite"></p>
        <ul id="lista"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
